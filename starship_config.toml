"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = false

format = """
${custom.rule}
${custom.prefix}\
$time\
$directory\
$git_branch\
$git_status\
$env_var\
$python\
$nodejs\
$golang\
$rust\
$java
$character"""

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind]($style) "

[env_var.AWS_ENVIRONMENT]
variable = "AWS_ENVIRONMENT"
style = "cyan"
format = "[$env_value]($style) "

[env_var.AWS_ENVIRONMENT_ROLE_NAME]
variable = "AWS_ROLE_NAME"
style = "cyan"
format = "[$env_value]($style) "

[python]
symbol = ""
style = "green"
format = "[$symbol$version(\\($virtualenv\\))]($style) "

[nodejs]
symbol = ""
style = "green"
format = "[$symbol$version]($style) "

[golang]
symbol = ""
style = "green"
format = "[$symbol$version]($style) "

[rust]
symbol = ""
style = "green"
format = "[$symbol$version]($style) "

[java]
symbol = ""
style = "green"
format = "[$symbol$version]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[time]
disabled = false
time_format = "%T"
style = "bright-black"
format = "[$time]($style) "

[custom.rule]
command = "printf '╭'; printf '%*s' \"$(( $(stty size </dev/tty | cut -d' ' -f2) - 1 ))\" '' | tr ' ' '─'"
when = true
style = "bright-black"
format = "[$output]($style)"

[custom.prefix]
command = "printf '├──'"
when = true
style = "bright-black"
format = "[$output ]($style)"
